<!doctype html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>suprise</title>
    <style>
      body {
        margin: 0;
        background: pink;
        text-align: center;
        overflow: hidden;
        font-family: Arial;
      }

      h1 {
        margin-top: 30px;
        color: #d63384;
      }

      /* Cake */
      .cake {
        font-size: 100px;
        margin-top: 20px;
        animation: bounce 1.5s infinite;
      }

      @keyframes bounce {
        0%,
        100% {
          transform: translateY(0);
        }

        50% {
          transform: translateY(-15px);
        }
      }

      /* Photo */
      .photo {
        width: 250px;
        height: 300px;
        object-fit: cover;
        border-radius: 20px;
        border: 5px solid white;
        margin-top: 15px;
      }

      /* Button */
      button {
        margin-top: 15px;
        padding: 10px 25px;
        border: none;
        border-radius: 20px;
        background-color: #ff4f9a;
        color: white;
        font-size: 16px;
      }

      /* Hearts */
      .heart {
        position: fixed;
        bottom: -20px;
        font-size: 25px;
        animation: heart 5s linear infinite;
      }

      @keyframes heart {
        0% {
          transform: translateY(0);
          opacity: 1;
        }

        100% {
          transform: translateY(-100vh);
          opacity: 0;
        }
      }
    </style>
  </head>

  <body>
    <div class="Center">
      <h1>🎉 Surprise! 🎉</h1>
      <style>
        body {
          display: flex;
          justify-self: center;
          align-items: center;
          height: 100vh;
        }
      </style>

      <!-- Cake -->
      <div class="cake">🎂</div>

      <!-- Photo -->
      <img src="baby.jpeg" class="photo" />

      <br />

      <button>💗 My Love 💗</button>

      <!-- Hearts -->
      <div class="heart" style="left: 10%; animation-delay: 0s">❤️</div>
      <div class="heart" style="left: 25%; animation-delay: 1s">💕</div>
      <div class="heart" style="left: 40%; animation-delay: 2s">💗</div>
      <div class="heart" style="left: 60%; animation-delay: 0.5s">💖</div>
      <div class="heart" style="left: 75%; animation-delay: 1.5s">❤️</div>
      <div class="heart" style="left: 90%; animation-delay: 2.5s">💕</div>
      <div>
        <a href="Photo.html"> <button>Photo</button> </a>
        <a href="Letter.html"> <button>Letter</button> </a>
      </div>
    </div>
  </body>
</html>
