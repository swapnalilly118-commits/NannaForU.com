<!doctype html>
<html>
  <head>
     <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>next</title>
    <style>
      body {
        background-color: maroon;
        color: white;
        font-family:
          "Trebuchet MS", "Lucida Sans Unicode", "Lucida Grande", "Lucida Sans",
          Arial, sans-serif;
      }
      .center {
        height: 100vh;
        display: flex;
        flex-direction: column;
        justify-self: center;
        align-items: center;
      }
      button {
        margin: 10px;
        padding: 10px 20px;
      }

      .heart {
        position: fixed;
        bottom: -20px;
        font-size: 25px;
        animation: heart 5s linear infinite;
      }

      @keyframes heart {
        0% {
          transform: translateY(0);
          opacity: 1;
        }

        100% {
          transform: translateY(-100vh);
          opacity: 0;
        }
      }
    </style>
  </head>

  <body>
    <div class="Center">
      <h1>Happy Birthday Nanna</h1>
      <div class="heart" style="left: 10%; animation-delay: 0s">🌷</div>
      <div class="heart" style="left: 25%; animation-delay: 1s">🌷</div>
      <div class="heart" style="left: 40%; animation-delay: 2s">🌷</div>
      <div class="heart" style="left: 60%; animation-delay: 0.5s">🌷</div>
      <div class="heart" style="left: 75%; animation-delay: 1.5s">🌷</div>
      <div class="heart" style="left: 90%; animation-delay: 2.5s">🌷</div>

      <style>
        body {
          display: flex;
          justify-self: center;
          align-items: center;
          height: 100vh;
        }
      </style>
      <div>
        <a href="Suprise.html"> <button>Suprise</button> </a>
        <a href="Photo.html"> <button>Photo</button> </a>
        <a href="Letter.html"> <button>Letter</button> </a>
      </div>
    </div>
  </body>
</html>
