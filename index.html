<!doctype html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Bdaybaby</title>
    <style>
      body {
        background-color: white;
        color: rgb(255, 0, 0);
        font-family: Cambria, Cochin, Georgia, Times, "Times New Roman", serif;
      }
      button {
        color: black;
        text-decoration: white;
        text-align: center;
      }
      body {
        margin: 0;
        overflow: hidden;
      }
      h1 {
        font-size: 50px;
        font-family: Georgia, "Times New Roman", Times, serif;
      }

      .heart {
        position: absolute;
        bottom: -50px;
        left: 50%;
        animation: rise 3s linear infinite;
      }
      @keyframes rise {
        0% {
          bottom: -50px;
          opacity: 0;
          transform: translateX(0);
        }
        20% {
          opacity: 1;
        }
        100% {
          bottom: 100vh;
          opacity: 0;
          transform: translateX(50px);
        }
      }
      .photo {
        width: 300px;
        height: 500px;
        position: fixed;
        left: 0;
        bottom: 0;
      }
    </style>
  </head>
  <body>
    <img src="spiii'.jpeg" class="photo" />
    <div class="heart" style="left: 10%; animation-delay: 0s">♥️</div>
    <div class="heart" style="left: 25%; animation-delay: 1s">♥️</div>
    <div class="heart" style="left: 40%; animation-delay: 2s">♥️</div>
    <div class="heart" style="left: 60%; animation-delay: 0.5s">🕷️</div>
    <div class="heart" style="left: 75%; animation-delay: 1.5s">🕷️</div>
    <div class="heart" style="left: 90%; animation-delay: 2.5s">🕸️</div>
    <div class="center">
      <h1>♥️Hi Baby!♥️</h1>
      <div>
        <a href="Next.html"> <button>Next</button> </a>
      </div>
    </div>
  </body>
</html>
