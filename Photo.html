<!doctype html>
<html>
  <head>
     <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Photo</title>
    <style>
      body {
        background-color: palevioletred;
        color: white;
        font-family:
          "Trebuchet MS", "Lucida Sans Unicode", "Lucida Grande", "Lucida Sans",
          Arial, sans-serif;
      }
      .center {
        height: 100vh;
        display: flex;
        flex-direction: column;
        justify-self: center;
        align-items: center;
      }
      .photo {
        width: 130px;
        height: 160px;
      }
      button {
        margin: 10px;
        padding: 10px 20px;
      }
      .heart {
        position:fixed;
        bottom: -20px;
        font-size: 25px;
        animation: heart 5s linear infinite;
      }

       @keyframes heart {
        0% {
          transform: translateY(0);
          opacity: 1;
        }

        100% {
          transform: translateY(-100vh);
          opacity: 0;
        }
      }
    </style>
  </head>
  <body>
    <div class="Center">
      <center><h1>🩵 Memories of our life 🩵</h1></center>
      <style>
        body {
          display: flex;
          justify-self: center;
          align-items: center;
          height: 100vh;
        }
      </style>
      <img src="first.jpeg" class="photo" />
      <img src="love.jpeg" class="photo" />
      <img src="life.jpeg" class="photo" />
      <img src="like.jpeg" class="photo" />
      <img src="mine.jpeg" class="photo" />
      <img src="world.jpeg" class="photo" />
      <div>
        <center>
          <h2>I LOVE YOU FOREVER🌹</h2>
        </center>
        <div class="heart" style="left: 10%; animation-delay: 0s">🤍</div>
      <div class="heart" style="left: 25%; animation-delay: 1s">🤍</div>
      <div class="heart" style="left: 40%; animation-delay: 2s">🤍</div>
      <div class="heart" style="left: 60%; animation-delay: 0.5s">🤍</div>
      <div class="heart" style="left: 75%; animation-delay: 1.5s">🤍</div>
      <div class="heart" style="left: 90%; animation-delay: 2.5s">🤍</div>
       <div class="heart" style="left: 10%; animation-delay: 0s">🤍</div>
      <div class="heart" style="left: 25%; animation-delay: 1s">🤍</div>
      <div class="heart" style="left: 40%; animation-delay: 2s">🤍</div> 
      <div class="heart" style="top: 90%; animation-delay: 2.5s">🤍</div>
      <div>
        <center>
          <a href="Letter.html"> <button>Letter</button> </a>
        </center>
      </div>
    </div>
  </body>
</html>
